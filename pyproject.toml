[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptiq-study"
version = "0.1.0"
description = "Desktop study app for importing course materials and reviewing flashcards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "google-genai>=1.0",
    "keyring>=25",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
synaptiq = "synaptiq.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synaptiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
